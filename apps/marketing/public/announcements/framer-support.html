<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Framer support is now in Modesto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #12151c;
        color: #fff;
        font-family:
          "DM Sans",
          -apple-system,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        container-type: size;
      }

      #silk {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 50% 42%, transparent 36%, rgba(8, 10, 16, 0.28) 100%),
          linear-gradient(
            180deg,
            rgba(8, 10, 16, 0.16) 0%,
            transparent 20%,
            transparent 78%,
            rgba(8, 10, 16, 0.24) 100%
          );
      }

      .copy {
        position: relative;
        z-index: 3;
        text-align: center;
      }

      .wordmark {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4em;
        margin-bottom: 0.42em;
      }

      .wordmark .pair {
        display: inline-flex;
        align-items: center;
        gap: 0.28em;
      }

      .wordmark img {
        display: block;
        width: 1.15em;
        height: 1.15em;
        object-fit: contain;
        color: #fff;
      }

      .wordmark .times {
        opacity: 0.4;
        padding: 0 0.08em;
      }

      .eyebrow {
        font-weight: 500;
        letter-spacing: -0.02em;
        color: #fff;
      }

      .copy h1 {
        font-weight: 600;
        letter-spacing: -0.055em;
        line-height: 0.98;
        color: #fff;
      }

      .spiral-wrap {
        position: relative;
        z-index: 2;
        min-height: 0;
      }

      .infinite-spiral {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        isolation: isolate;
      }

      .infinite-spiral__stage {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
      }

      .infinite-spiral__item {
        position: absolute;
        top: 50%;
        left: 50%;
        display: block;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 0.22);
        background: rgb(255 255 255 / 0.06);
        box-shadow: 0 18px 46px rgb(8 6 18 / 0.34);
        transform-style: preserve-3d;
        backface-visibility: hidden;
        will-change: transform, opacity, filter;
      }

      .infinite-spiral__image {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
        user-select: none;
        pointer-events: none;
        image-rendering: auto;
      }

      /* 9:16 */
      .ratio-9x16 .board {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 8.5% 7% 4%;
        gap: 3%;
      }

      .ratio-9x16 .copy {
        width: 100%;
        flex: 0 0 auto;
      }

      .ratio-9x16 .eyebrow {
        font-size: 3.1cqw;
      }

      .ratio-9x16 .copy h1 {
        font-size: 8.1cqw;
      }

      .ratio-9x16 .spiral-wrap {
        width: 100%;
        flex: 1 1 auto;
      }

      /* 16:9 */
      .ratio-16x9 .board {
        height: 100%;
        display: flex;
        flex-direction: row;
        align-items: center;
        padding: 0 5.5%;
        gap: 3%;
      }

      .ratio-16x9 .copy {
        flex: 0 0 38%;
        text-align: left;
      }

      .ratio-16x9 .wordmark {
        justify-content: flex-start;
      }

      .ratio-16x9 .eyebrow {
        font-size: 1.55cqw;
      }

      .ratio-16x9 .copy h1 {
        font-size: 4.15cqw;
      }

      .ratio-16x9 .spiral-wrap {
        flex: 1 1 auto;
        height: 100%;
      }

      /* 1:1 */
      .ratio-1x1 .board {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 7%;
        gap: 3.5%;
      }

      .ratio-1x1 .copy {
        width: 100%;
      }

      .ratio-1x1 .eyebrow {
        font-size: 2.9cqw;
      }

      .ratio-1x1 .copy h1 {
        font-size: 7cqw;
      }

      .ratio-1x1 .spiral-wrap {
        width: 100%;
        flex: 1 1 auto;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <canvas id="silk"></canvas>
      <div class="vignette"></div>
      <div class="board">
        <div class="copy">
          <div class="wordmark">
            <span class="pair eyebrow"><img src="./framer-mark.svg" alt="" />Framer</span>
            <span class="times eyebrow">×</span>
            <span class="pair eyebrow"><img src="./modesto-mark-light.svg" alt="" />Modesto</span>
          </div>
          <h1>Framer support is<br />now in Modesto.</h1>
        </div>
        <div class="spiral-wrap">
          <div class="infinite-spiral" id="spiral" role="list">
            <div class="infinite-spiral__stage" id="spiralStage"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";

      const TEMPLATES = [
        ["01-kima.jpg", "Kima"],
        ["02-maestroclass.jpg", "MaestroClass"],
        ["03-tdmaxfolio.jpg", "TD_Maxfolio"],
        ["04-spector.jpg", "Spector"],
        ["05-fabrica.jpg", "Fabrica"],
        ["06-neiden.jpg", "Neiden"],
        ["07-myos.png", "MyOS"],
        ["08-calder.jpg", "Calder"],
        ["09-agenciy.jpg", "Agenciy"],
        ["10-auton.jpg", "AUTON"],
        ["11-das-studio.jpg", "Das Studio"],
        ["12-vertical.jpg", "Vertical"],
        ["13-create.jpg", "Create"],
        ["14-nyro.jpg", "Nyro"],
        ["15-eric-cole.jpg", "ERIC COLE"],
        ["16-message.jpg", "Message"],
      ];

      const params = new URLSearchParams(location.search);
      const ratio = ["9x16", "16x9", "1x1"].includes(params.get("ratio"))
        ? params.get("ratio")
        : "9x16";
      const recording = params.get("record") === "1";
      document.body.classList.add(`ratio-${ratio}`);

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
      const modulo = (value, divisor) => ((value % divisor) + divisor) % divisor;
      const smoothstep = (min, max, value) => {
        const x = clamp((value - min) / (max - min || 1), 0, 1);
        return x * x * (3 - 2 * x);
      };

      const vertexShader = `
        varying vec2 vUv;
        varying vec3 vPosition;

        void main() {
          vPosition = position;
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `;

      const fragmentShader = `
        varying vec2 vUv;
        varying vec3 vPosition;

        uniform float uTime;
        uniform vec3 uColor;
        uniform float uSpeed;
        uniform float uScale;
        uniform float uRotation;
        uniform float uNoiseIntensity;
        uniform float uLightMode;

        const float e = 2.71828182845904523536;

        float noise(vec2 texCoord) {
          float G = e;
          vec2 r = (G * sin(G * texCoord));
          return fract(r.x * r.y * (1.0 + texCoord.x));
        }

        vec2 rotateUvs(vec2 uv, float angle) {
          float c = cos(angle);
          float s = sin(angle);
          mat2 rot = mat2(c, -s, s, c);
          return rot * uv;
        }

        void main() {
          float rnd = noise(gl_FragCoord.xy);
          vec2 uv = rotateUvs(vUv * uScale, uRotation);
          vec2 tex = uv * uScale;
          float tOffset = uSpeed * uTime;

          tex.y += 0.03 * sin(8.0 * tex.x - tOffset);

          float pattern = 0.6 +
            0.4 * sin(5.0 * (tex.x + tex.y +
              cos(3.0 * tex.x + 5.0 * tex.y) +
              0.02 * tOffset) +
              sin(20.0 * (tex.x + tex.y - 0.1 * tOffset)));

          float grain = rnd / 15.0 * uNoiseIntensity;
          vec3 result = uColor * pattern - vec3(grain);
          if (uLightMode > 0.5) {
            float fold = smoothstep(0.28, 0.9, pattern);
            float specular = smoothstep(0.72, 0.98, pattern);
            vec3 shadowColor = uColor * 0.72;
            vec3 bodyColor = min(uColor * 1.18, vec3(1.0));
            vec3 lightBase = mix(shadowColor, bodyColor, fold);
            lightBase = mix(lightBase, vec3(1.0), specular * 0.92);
            float fineNoise = noise(gl_FragCoord.xy * 0.63 + vec2(17.0, 41.0));
            float grainSignal = (rnd + fineNoise - 1.0);
            float grainStrength = clamp(uNoiseIntensity * 0.038, 0.0, 0.16);
            result = lightBase + grainSignal * grainStrength;
          }
          gl_FragColor = vec4(clamp(result, 0.0, 1.0), 1.0);
        }
      `;

      function startSilk(canvas) {
        const renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: true,
          alpha: false,
          powerPreference: "high-performance",
        });
        renderer.setClearColor(0x12151c, 1);
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const uniforms = {
          uSpeed: { value: 5 },
          uScale: { value: 1 },
          uNoiseIntensity: { value: 1.45 },
          uColor: { value: new THREE.Color("#7D8598") },
          uRotation: { value: 0 },
          uLightMode: { value: 0 },
          uTime: { value: 0 },
        };
        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(2, 2),
          new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader }),
        );
        scene.add(mesh);

        const resize = () => {
          const { clientWidth, clientHeight } = canvas.parentElement;
          renderer.setPixelRatio(Math.max(2, window.devicePixelRatio || 1));
          renderer.setSize(clientWidth, clientHeight, false);
        };
        resize();
        window.addEventListener("resize", resize);

        const draw = (seconds) => {
          uniforms.uTime.value = 0.1 * seconds;
          renderer.render(scene, camera);
        };
        return { draw };
      }

      function cardMetrics(root) {
        const width = Math.max(root.clientWidth, 1);
        const height = Math.max(root.clientHeight, 1);
        const base = {
          "9x16": {
            cardWidth: 360,
            cardHeight: 252,
            radius: 236,
            verticalSpacing: 86,
            cardsPerTurn: 6.5,
          },
          "16x9": {
            cardWidth: 400,
            cardHeight: 280,
            radius: 260,
            verticalSpacing: 90,
            cardsPerTurn: 6.5,
          },
          "1x1": {
            cardWidth: 340,
            cardHeight: 238,
            radius: 222,
            verticalSpacing: 82,
            cardsPerTurn: 6.5,
          },
        }[ratio];
        const fit = Math.min(1, width / (base.cardWidth * 2.8), height / (base.cardHeight * 2.35));
        return {
          ...base,
          fit,
          width,
          height,
          perspective: 1100,
          centerScale: 1,
          edgeFade: 0.28,
          edgeBlur: recording ? 2.4 : 4,
          cardRadius: 12,
          speed: 0.48,
        };
      }

      function startSpiral(root, stage) {
        const cards = TEMPLATES.map(([file, label], index) => {
          const item = document.createElement("div");
          item.className = "infinite-spiral__item";
          item.setAttribute("role", "listitem");
          item.setAttribute("aria-label", label);
          const img = document.createElement("img");
          img.className = "infinite-spiral__image";
          img.src = `./framer-support-templates/${file}`;
          img.alt = label;
          img.draggable = false;
          img.loading = "eager";
          img.decoding = "sync";
          item.appendChild(img);
          stage.appendChild(item);
          return { item, img };
        });

        let metrics = cardMetrics(root);
        const applyMetrics = () => {
          metrics = cardMetrics(root);
          root.style.perspective = `${metrics.perspective}px`;
          cards.forEach(({ item }) => {
            item.style.width = `${metrics.cardWidth}px`;
            item.style.height = `${metrics.cardHeight}px`;
            item.style.borderRadius = `${metrics.cardRadius}px`;
          });
        };
        applyMetrics();
        new ResizeObserver(applyMetrics).observe(root);

        const draw = (seconds) => {
          const progress = metrics.speed * seconds;
          const count = cards.length;
          const half = count / 2;
          const fadeStart = clamp(1 - metrics.edgeFade, 0, 0.98);
          const turnSize = Math.max(metrics.cardsPerTurn, 1);
          const responsiveRadius =
            Math.min(metrics.radius, Math.max(72, metrics.width * 0.36)) * metrics.fit;

          cards.forEach(({ item }, index) => {
            let offset = index - progress;
            offset = modulo(offset + half, count) - half;
            const edge = Math.min(Math.abs(offset) / Math.max(half, 1), 1);
            const opacity = 1 - smoothstep(fadeStart, 1, edge);
            const focus = 1 - Math.min(Math.abs(offset) / Math.max(turnSize * 0.65, 1), 1);
            const scale = (1 + (metrics.centerScale - 1) * focus) * metrics.fit;
            const angle = offset * (360 / turnSize);
            const angleRadians = (angle * Math.PI) / 180;
            const x = Math.sin(angleRadians) * responsiveRadius;
            const z = Math.cos(angleRadians) * responsiveRadius;
            const depthScale = clamp(
              metrics.perspective / Math.max(metrics.perspective - z, 1),
              0.7,
              1,
            );
            const visualScale = Math.min(1, scale * depthScale);
            const depth = (z / Math.max(responsiveRadius, 1) + 1) / 2;
            const blur = metrics.edgeBlur * smoothstep(0.42, 1, edge);
            item.style.transform = `translate(-50%, -50%) translate3d(${x}px, ${offset * metrics.verticalSpacing * metrics.fit}px, 0) scale(${visualScale})`;
            item.style.opacity = opacity.toFixed(3);
            item.style.filter = blur > 0.08 ? `blur(${blur.toFixed(2)}px)` : "none";
            item.style.zIndex = String(Math.round(depth * 100000) + index);
          });
        };

        return {
          draw,
          ready: Promise.all(
            cards.map(
              ({ img }) =>
                img.decode?.().catch(() => undefined) ??
                new Promise((resolve) => {
                  if (img.complete) resolve();
                  else img.addEventListener("load", resolve, { once: true });
                }),
            ),
          ),
        };
      }

      const silk = startSilk(document.getElementById("silk"));
      const spiral = startSpiral(
        document.getElementById("spiral"),
        document.getElementById("spiralStage"),
      );

      let clock = 0;
      const renderAt = (seconds) => {
        clock = seconds;
        silk.draw(seconds);
        spiral.draw(seconds);
      };

      window.__setTime = renderAt;
      window.__ready = Promise.all([document.fonts.ready, spiral.ready]).then(() => {
        renderAt(0);
        return true;
      });

      if (!recording) {
        const started = performance.now();
        const tick = (now) => {
          renderAt((now - started) / 1000);
          requestAnimationFrame(tick);
        };
        window.__ready.then(() => requestAnimationFrame(tick));
      }
    </script>
  </body>
</html>
