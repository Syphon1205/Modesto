<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modesto — Switching</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./films.css" />
    <link rel="stylesheet" href="./signal.css" />
    <style>
      .agent {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2.4cqw;
      }
      .agent .mark {
        width: 7.2cqw;
        height: 7.2cqw;
        color: currentColor;
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="Claude, then Codex">
      <div class="row">
        <div class="agent a0">
          <i class="mark" data-mark="claude" aria-hidden="true"></i>
          <h1 class="word">Claude</h1>
        </div>
        <div class="agent a1" style="opacity: 0">
          <i class="mark" data-mark="codex" aria-hidden="true"></i>
          <h1 class="word">Codex</h1>
        </div>
      </div>
    </main>
    <script src="../modesto-saas-assets/vendor/gsap.min.js"></script>
    <script src="./runtime.js"></script>
    <script>
      ModestoTeaser.boot({
        duration: 12,
        sceneAt: (t) => (t < 6 ? 0 : 1),
        build(tl) {
          tl.fromTo(".row", { opacity: 0 }, { opacity: 1, duration: 0.55 }, 0.12)
            .to(".a0", { opacity: 0, duration: 0.35 }, 5.6)
            .to(".a1", { opacity: 1, duration: 0.35 }, 5.7);
        },
      });
    </script>
  </body>
</html>
