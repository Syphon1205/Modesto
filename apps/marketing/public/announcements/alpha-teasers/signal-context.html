<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modesto — Context carried forward</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./films.css" />
    <link rel="stylesheet" href="./signal.css" />
    <style>
      .row .status-dot {
        width: 1.35cqw;
        height: 1.35cqw;
        flex: none;
      }
      body[data-ratio="9x16"] .row .status-dot {
        width: 2.6cqw;
        height: 2.6cqw;
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="Context carried forward">
      <div class="row">
        <i class="status-dot" aria-hidden="true"></i>
        <h1 class="word mono">Context carried forward</h1>
      </div>
    </main>
    <script src="../modesto-saas-assets/vendor/gsap.min.js"></script>
    <script src="./runtime.js"></script>
    <script>
      ModestoTeaser.boot({
        duration: 10,
        sceneAt: () => 0,
        build(tl) {
          tl.fromTo(".row", { opacity: 0 }, { opacity: 1, duration: 0.7 }, 0.2);
        },
      });
    </script>
  </body>
</html>
