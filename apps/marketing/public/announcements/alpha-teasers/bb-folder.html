<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modesto — No folder required.</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./films.css" />
    <link rel="stylesheet" href="./billboard.css" />
    <style>
      .composer {
        width: 72cqw;
        margin: 0 auto;
        padding: 2.2cqw;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 0.7cqw;
      }
      .prompt {
        margin: 2cqh 0 2.4cqh;
        font-size: 2.2cqw;
        letter-spacing: -0.03em;
        line-height: 1.35;
        color: #dfe6d4;
        min-height: 2.6em;
      }
      /* Typed reveal: one clipped inline-block, measured once at build time. */
      .typed {
        display: inline-block;
        overflow: hidden;
        white-space: nowrap;
        vertical-align: bottom;
      }
      .caret {
        display: inline-block;
        width: 0.09em;
        height: 1.05em;
        vertical-align: text-bottom;
        margin-left: 0.06em;
        background: var(--lime);
      }
      .send {
        margin-left: auto;
        width: 2.4cqw;
        height: 2.4cqw;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #2a3124;
        color: var(--dim);
        font-size: 1.1cqw;
      }
      .send.is-ready {
        background: var(--lime);
        color: #14180f;
      }
      .picker {
        display: inline-flex;
        align-items: center;
        gap: 0.45cqw;
        padding: 0.55cqh 0.8cqw;
        border-radius: 0.55cqw;
        background: #10120f;
        border: 1px solid var(--line-strong);
        font-size: 1.35cqw;
        letter-spacing: -0.02em;
        color: #cfd6c6;
      }
      .picker .mark {
        width: 1.2cqw;
        height: 1.2cqw;
      }
      .hint {
        text-align: center;
        margin-top: 3.4cqh;
      }
      body[data-ratio="9x16"] .composer {
        width: 86cqw;
        padding: 4cqw;
      }
      body[data-ratio="9x16"] .prompt {
        font-size: 4cqw;
        white-space: normal;
      }
      body[data-ratio="9x16"] .picker {
        font-size: 2.5cqw;
      }
      body[data-ratio="9x16"] .picker .mark {
        width: 2.8cqw;
        height: 2.8cqw;
      }
      body[data-ratio="9x16"] .send {
        width: 5.4cqw;
        height: 5.4cqw;
        font-size: 2.4cqw;
      }
      body[data-ratio="1x1"] .composer {
        width: 84cqw;
      }
      body[data-ratio="1x1"] .prompt {
        font-size: 2.5cqw;
      }
      body[data-ratio="1x1"] .picker {
        font-size: 1.6cqw;
      }
      body[data-ratio="1x1"] .picker .mark {
        width: 1.7cqw;
        height: 1.7cqw;
      }
      body[data-ratio="1x1"] .send {
        width: 3.4cqw;
        height: 3.4cqw;
        font-size: 1.5cqw;
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="No folder required.">
      <div class="bb-field" aria-hidden="true"></div>
      <div class="bb-grain" aria-hidden="true"></div>

      <section class="scene s0 is-first" aria-label="No folder required">
        <div class="bb-stage">
          <h1 class="bb bb-lg">
            <span class="bb-line"><span>No folder</span></span>
            <span class="bb-line"
              ><span><em>required.</em></span></span
            >
          </h1>
        </div>
      </section>

      <section class="scene s1" aria-label="The composer">
        <div class="bb-stage">
          <div class="composer bb-panel">
            <div class="row">
              <span class="bb-chip">NEW CHAT</span>
              <span class="bb-chip is-quiet">NO PROJECT YET</span>
            </div>
            <p class="prompt">
              <span class="typed" id="typed"
                >Sketch a dark-mode settings screen and explain the tradeoffs</span
              ><i class="caret" id="caret" aria-hidden="true"></i>
            </p>
            <div class="row">
              <span class="picker" id="picker">
                <i class="mark" data-mark="claude" aria-hidden="true"></i>Claude · Opus
              </span>
              <span class="picker" id="picker2">Thinking · High</span>
              <span class="send" id="send" aria-hidden="true">↑</span>
            </div>
          </div>
          <p class="bb-meta hint" id="hint">PICK A FOLDER LATER — OR NEVER</p>
        </div>
      </section>

      <section class="scene s2" aria-label="Just start">
        <div class="bb-stage">
          <h1 class="bb bb-lg">
            <span class="bb-line"
              ><span>Just <em>start.</em></span></span
            >
          </h1>
        </div>
      </section>

      <div class="bb-rule" id="rule" style="bottom: 12.5cqh" aria-hidden="true"></div>
      <div class="bb-rail" id="rail">
        <i class="mark" data-mark="modesto" aria-hidden="true"></i><span>modesto</span>
        <span class="ver">1.0.0-ALPHA.1</span>
      </div>
      <div class="film-progress" aria-hidden="true"></div>
    </main>

    <script src="../modesto-saas-assets/vendor/gsap.min.js"></script>
    <script src="./runtime.js"></script>
    <script>
      ModestoTeaser.boot({
        duration: 14,
        sceneAt: (t) => (t < 4.4 ? 0 : t < 10.8 ? 1 : 2),
        build(tl, gsap) {
          const typed = document.getElementById("typed");
          // Measure once, then animate a clip width — no per-frame layout work.
          const full = typed.scrollWidth;

          tl.set(".s0", { autoAlpha: 1 }, 0)
            .fromTo(
              ".s0 .bb-line > span",
              { yPercent: 108 },
              { yPercent: 0, duration: 1.1, stagger: 0.09, ease: "expo.out" },
              0.3,
            )
            .fromTo("#rail", { opacity: 0 }, { opacity: 1, duration: 0.9 }, 0.9)
            .fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: "expo.out" }, 0.6)
            .to(
              ".s0 .bb-line > span",
              { yPercent: -108, duration: 0.65, stagger: 0.05, ease: "expo.in" },
              3.8,
            )
            .set(".s0", { autoAlpha: 0 }, 4.5)

            .set(".s1", { autoAlpha: 1 }, 4.4)
            .fromTo(
              ".composer",
              { opacity: 0, y: 26, scale: 0.985 },
              { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "expo.out" },
              4.45,
            )
            // typing
            .fromTo(typed, { width: 0 }, { width: full, duration: 2.4, ease: "steps(46)" }, 5.2)
            .fromTo(
              "#caret",
              { opacity: 1 },
              { opacity: 0, duration: 0.001, repeat: 14, yoyo: true, repeatDelay: 0.42 },
              5.2,
            )
            .to("#caret", { opacity: 0, duration: 0.2 }, 7.8)
            // the send button arms once there's something to send
            .to("#send", { className: "send is-ready", duration: 0 }, 7.8)
            .fromTo(
              "#send",
              { scale: 1 },
              { scale: 1.12, duration: 0.22, yoyo: true, repeat: 1, ease: "power2.out" },
              7.8,
            )
            .fromTo("#hint", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 8.4)
            .to(".s1", { autoAlpha: 0, duration: 0.45 }, 10.4)

            .set(".s2", { autoAlpha: 1 }, 10.8)
            .fromTo(
              ".s2 .bb-line > span",
              { yPercent: 108 },
              { yPercent: 0, duration: 1.1, ease: "expo.out" },
              10.9,
            )
            .to(
              "#rule",
              { scaleX: 0, transformOrigin: "100% 50%", duration: 0.9, ease: "expo.inOut" },
              12.7,
            )
            .to(["#rail", ".s2"], { opacity: 0, duration: 0.6 }, 13.3);
        },
      });
    </script>
  </body>
</html>
