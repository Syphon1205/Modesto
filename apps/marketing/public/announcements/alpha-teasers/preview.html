<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Modesto — Alpha teaser preview</title>
    <link rel="stylesheet" href="./preview.css" />
  </head>
  <body>
    <div class="preview-brand">
      <img src="../modesto-mark-light.svg" alt="" />modesto
      <span>Alpha teasers · 1.0.0-alpha.1</span>
    </div>
    <main class="preview-shell">
      <div class="preview-head">
        <div>
          <p class="eyebrow" id="film-kicker">01 / BILLBOARD</p>
          <h1 id="film-title">Every agent.</h1>
          <p class="lede" id="film-blurb">
            The canonical line at billboard scale, with the full provider roster between.
          </p>
        </div>
        <div class="toggles">
          <div class="formats" role="group" aria-label="Film format">
            <button type="button" aria-pressed="true" data-ratio="16x9">16:9 Landscape</button>
            <button type="button" aria-pressed="false" data-ratio="9x16">9:16 Vertical</button>
            <button type="button" aria-pressed="false" data-ratio="1x1">1:1 Square</button>
          </div>
          <div class="formats themes" id="themes" role="group" aria-label="Film theme" hidden>
            <button type="button" aria-pressed="true" data-theme="dark">Dark</button>
            <button type="button" aria-pressed="false" data-theme="light">Light</button>
          </div>
        </div>
      </div>
      <div class="tabs" id="tabs" role="tablist" aria-label="Teaser style"></div>
      <div class="player-shell">
        <div class="stage-well" data-ratio="16x9">
          <iframe
            class="film"
            id="film"
            title="Modesto alpha teaser"
            src="./bb-lineup.html?ratio=16x9&embed=1"
            allow="autoplay"
          ></iframe>
        </div>
        <p class="error" id="error" hidden>The film could not load. Reload to try again.</p>
        <div class="controls">
          <button class="control play" id="play" type="button" aria-label="Pause film">
            Ⅱ &nbsp; Pause
          </button>
          <button class="control" id="replay" type="button" aria-label="Restart film">↺</button>
          <span class="time" id="elapsed">00:00</span>
          <input
            class="seek"
            id="seek"
            type="range"
            min="0"
            max="15.99"
            step="0.01"
            value="0"
            aria-label="Film position"
          />
          <span class="time" id="remaining">00:16</span>
          <a
            class="full"
            id="open"
            href="./bb-lineup.html?ratio=16x9"
            target="_blank"
            rel="noopener"
            aria-label="Open film in a new tab"
            >↗</a
          >
          <button class="export" id="export" type="button" aria-label="Download the film as an MP4">
            ⤓&nbsp; Download
          </button>
        </div>
      </div>
      <div class="meta">
        <span id="format-label">LANDSCAPE · 1920 × 1080</span>
        <span id="duration-label">16 SECONDS · SILENT · GSAP</span>
      </div>
      <p class="export-status" id="export-status" role="status" aria-live="polite"></p>
      <nav class="chapters" id="chapters" aria-label="Jump to a scene"></nav>
    </main>
    <script src="./catalog.js"></script>
    <script src="./preview.js"></script>
  </body>
</html>
