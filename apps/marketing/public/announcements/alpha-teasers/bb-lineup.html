<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modesto — Every agent. One workspace.</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./films.css" />
    <link rel="stylesheet" href="./billboard.css" />
    <style>
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2.1cqh 2.4cqw;
        width: 68cqw;
        margin: 0 auto;
      }
      .cell {
        display: flex;
        align-items: center;
        gap: 0.85cqw;
        font-family: var(--mono);
        font-size: 1.3cqw;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        will-change: transform, opacity;
      }
      .cell .mark {
        width: 3.1cqw;
        height: 3.1cqw;
        color: var(--fg);
        flex: none;
      }
      .count {
        text-align: center;
        margin-top: 5cqh;
      }
      body[data-ratio="9x16"] .grid {
        grid-template-columns: repeat(2, 1fr);
        width: 76cqw;
        gap: 2.6cqh 4cqw;
      }
      body[data-ratio="9x16"] .cell {
        font-size: 2.5cqw;
        gap: 2cqw;
      }
      body[data-ratio="9x16"] .cell .mark {
        width: 5.6cqw;
        height: 5.6cqw;
      }
      body[data-ratio="1x1"] .grid {
        grid-template-columns: repeat(3, 1fr);
        width: 78cqw;
        gap: 2.2cqh 3cqw;
      }
      body[data-ratio="1x1"] .cell {
        font-size: 1.6cqw;
      }
      body[data-ratio="1x1"] .cell .mark {
        width: 3.6cqw;
        height: 3.6cqw;
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="Every agent. One workspace.">
      <div class="bb-field" aria-hidden="true"></div>
      <div class="bb-grain" aria-hidden="true"></div>

      <section class="scene s0 is-first" aria-label="Every agent">
        <div class="bb-stage">
          <h1 class="bb bb-xl">
            <span class="bb-line"><span>Every</span></span>
            <span class="bb-line"><span>agent.</span></span>
          </h1>
        </div>
      </section>

      <section class="scene s1" aria-label="The providers">
        <div class="bb-stage">
          <div class="grid" id="grid"></div>
          <p class="bb-meta count in">SHIPPING IN <em>1.0.0-ALPHA.1</em></p>
        </div>
      </section>

      <section class="scene s2" aria-label="One workspace">
        <div class="bb-stage">
          <h1 class="bb bb-xl">
            <span class="bb-line"><span>One</span></span>
            <span class="bb-line"
              ><span><em>workspace.</em></span></span
            >
          </h1>
        </div>
      </section>

      <div class="bb-rule" id="rule" style="bottom: 12.5cqh" aria-hidden="true"></div>
      <div class="bb-rail" id="rail">
        <i class="mark" data-mark="modesto" aria-hidden="true"></i><span>modesto</span>
        <span class="ver">1.0.0-ALPHA.1</span>
      </div>
      <div class="film-progress" aria-hidden="true"></div>
    </main>

    <script src="../modesto-saas-assets/vendor/gsap.min.js"></script>
    <script src="./runtime.js"></script>
    <script>
      const PROVIDERS = [
        ["codex", "Codex"],
        ["claude", "Claude"],
        ["cursor", "Cursor"],
        ["gemini", "Gemini"],
        ["grok", "Grok"],
        ["droid", "Droid"],
        ["opencode", "OpenCode"],
        ["copilot", "Copilot"],
        ["meta", "Meta"],
        ["kilo", "Kilo"],
        ["qwen", "Qwen"],
        ["kimi", "Kimi"],
        ["pi", "Pi"],
        ["devin", "Devin"],
        ["poolside", "Poolside"],
        ["acp", "ACP"],
      ];
      document.getElementById("grid").innerHTML = PROVIDERS.map(
        ([id, name]) =>
          `<div class="cell"><i class="mark" data-mark="${id}"></i><span>${name}</span></div>`,
      ).join("");

      ModestoTeaser.boot({
        duration: 16,
        sceneAt: (t) => (t < 5.2 ? 0 : t < 11 ? 1 : 2),
        build(tl) {
          // Billboard motion: one confident move per beat, then it holds.
          tl.set(".s0", { autoAlpha: 1 }, 0)
            .fromTo(
              ".s0 .bb-line > span",
              { yPercent: 108 },
              { yPercent: 0, duration: 1.15, stagger: 0.09, ease: "expo.out" },
              0.35,
            )
            .fromTo("#rail", { opacity: 0 }, { opacity: 1, duration: 0.9 }, 0.9)
            .fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: "expo.out" }, 0.6)
            .to(
              ".s0 .bb-line > span",
              { yPercent: -108, duration: 0.75, stagger: 0.05, ease: "expo.in" },
              4.5,
            )
            .set(".s0", { autoAlpha: 0 }, 5.35)

            // The lineup: marks land in a fast cascade, then the frame rests.
            .set(".s1", { autoAlpha: 1 }, 5.2)
            .fromTo(
              ".cell",
              { opacity: 0, y: 18 },
              { opacity: 1, y: 0, duration: 0.7, stagger: 0.045, ease: "power3.out" },
              5.35,
            )
            .fromTo(".count", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 7.4)
            .to(".s1", { autoAlpha: 0, duration: 0.45 }, 10.6)

            .set(".s2", { autoAlpha: 1 }, 11)
            .fromTo(
              ".s2 .bb-line > span",
              { yPercent: 108 },
              { yPercent: 0, duration: 1.15, stagger: 0.09, ease: "expo.out" },
              11.1,
            )
            .to(
              "#rule",
              { scaleX: 0, transformOrigin: "100% 50%", duration: 0.9, ease: "expo.inOut" },
              14.6,
            )
            .to(["#rail", ".s2"], { opacity: 0, duration: 0.6 }, 15.3);
        },
      });
    </script>
  </body>
</html>
