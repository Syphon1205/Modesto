<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modesto 0.4.0 Berkeley — Clean Colorful 9:16 Video</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #000000;
        color: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow-x: hidden;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        width: 100%;
        max-width: 440px;
      }

      /* 9:16 Video Mockup Frame */
      .video-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 9 / 16;
        background: #000000;
        border-radius: 24px;
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.9),
          0 0 0 1px rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        background: #000000;
      }

      /* Action bar */
      .actions {
        display: flex;
        gap: 12px;
        width: 100%;
      }

      button,
      .btn {
        flex: 1;
        padding: 14px 20px;
        border-radius: 12px;
        background: #121312;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #ffffff;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: -0.01em;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 150ms ease;
      }

      button:hover,
      .btn:hover {
        background: #ffffff;
        color: #000000;
        border-color: #ffffff;
      }

      .btn-download {
        background: linear-gradient(135deg, #34d399, #38bdf8);
        color: #000000;
        font-weight: 600;
        border: none;
      }
      .btn-download:hover {
        opacity: 0.9;
        background: linear-gradient(135deg, #34d399, #38bdf8);
        color: #000000;
      }

      .meta {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.45);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="video-frame">
        <video
          id="videoPlayer"
          src="./modesto-0.4.0-berkeley-colorful.mp4"
          playsinline
          autoplay
          loop
          muted
        ></video>
      </div>

      <div class="actions">
        <button type="button" id="playBtn">Pause ⏸</button>
        <button type="button" id="replayBtn">Restart ↺</button>
        <a
          href="./modesto-0.4.0-berkeley-colorful.mp4"
          download="modesto-0.4.0-berkeley.mp4"
          class="btn btn-download"
          >Download MP4 ↓</a
        >
      </div>

      <p class="meta">1080 × 1920 · 60 FPS · Pure Black &amp; Colorful Glow</p>
    </div>

    <script>
      const video = document.getElementById("videoPlayer");
      const playBtn = document.getElementById("playBtn");
      const replayBtn = document.getElementById("replayBtn");

      playBtn.addEventListener("click", () => {
        if (video.paused) {
          video.play();
          playBtn.textContent = "Pause ⏸";
        } else {
          video.pause();
          playBtn.textContent = "Play ▶";
        }
      });

      replayBtn.addEventListener("click", () => {
        video.currentTime = 0;
        video.play();
        playBtn.textContent = "Pause ⏸";
      });
    </script>
  </body>
</html>
