    <text x="72" y="122" fill="url(#title)" font-size="43" font-weight="680" letter-spacing="-1.4">A shared room for work in motion.</text>
    <text x="72" y="154" fill="#9297A4" font-size="17">Runs, checkpoints, handoffs, and graphs—visible in one place.</text>
  </g>

