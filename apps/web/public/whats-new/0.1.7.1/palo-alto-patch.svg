<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="30" x2="1120" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171A21"/>
      <stop offset=".52" stop-color="#0D1016"/>
      <stop offset="1" stop-color="#080A0E"/>
    </linearGradient>
    <linearGradient id="title" x1="70" y1="0" x2="740" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#E8E9F5"/>
      <stop offset="1" stop-color="#AAB2EF"/>
    </linearGradient>
    <linearGradient id="flow" x1="205" y1="0" x2="1010" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C86DC"/>
      <stop offset=".5" stop-color="#AAB1EE"/>
      <stop offset="1" stop-color="#66C7B1"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#7580D8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#7580D8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".44"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
