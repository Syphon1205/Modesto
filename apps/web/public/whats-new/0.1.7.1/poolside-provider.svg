<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Poolside logomark: poolside.ai, reversed (dark-background) variant, used to identify the provider in the Palo Alto patch. -->
  <defs>
    <linearGradient id="bg" x1="70" y1="24" x2="1130" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17191F"/>
      <stop offset=".54" stop-color="#0D0F14"/>
      <stop offset="1" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="bridge" x1="505" y1="0" x2="695" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7F8"/>
      <stop offset=".5" stop-color="#8B84FF"/>
      <stop offset="1" stop-color="#4137FF"/>
    </linearGradient>
    <linearGradient id="rule" x1="390" y1="0" x2="810" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7F8" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#8B84FF"/>
      <stop offset="1" stop-color="#4137FF" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="poolsideDisc" x1="836" y1="232" x2="968" y2="364" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5A50FF"/>
      <stop offset="1" stop-color="#3226E0"/>
    </linearGradient>
    <radialGradient id="leftGlow">
      <stop stop-color="#A78BFA" stop-opacity=".2"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow">
      <stop stop-color="#4137FF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#4137FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <circle cx="242" cy="330" r="245" fill="url(#leftGlow)" filter="url(#blur)"/>
  <circle cx="958" cy="330" r="245" fill="url(#rightGlow)" filter="url(#blur)"/>
  <path d="M54 148H1146M54 566H1146" stroke="#FFFFFF" stroke-opacity=".035"/>

  <text x="600" y="91" fill="#F8F8FA" font-family="-apple-system,BlinkMacSystemFont,Inter,Arial,sans-serif" font-size="44" font-weight="680" text-anchor="middle" letter-spacing="-1.3">Modesto now supports Poolside</text>
  <text x="600" y="132" fill="#969AA5" font-family="-apple-system,BlinkMacSystemFont,Inter,Arial,sans-serif" font-size="18" text-anchor="middle">Your authenticated Poolside deployment, as a first-class provider.</text>

