<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Poolside logomark: poolside.ai, reversed (dark-background) variant, used to identify the provider. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A1361"/>
      <stop offset=".52" stop-color="#1A0B44"/>
      <stop offset="1" stop-color="#0C0524"/>
    </linearGradient>
    <radialGradient id="blobViolet" cx=".5" cy=".5" r=".5">
      <stop stop-color="#8B5CF6" stop-opacity=".85"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobIndigo" cx=".5" cy=".5" r=".5">
      <stop stop-color="#4137FF" stop-opacity=".8"/>
      <stop offset="1" stop-color="#4137FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobMagenta" cx=".5" cy=".5" r=".5">
      <stop stop-color="#C026D3" stop-opacity=".62"/>
      <stop offset="1" stop-color="#C026D3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobLilac" cx=".5" cy=".5" r=".5">
      <stop stop-color="#C4B5FD" stop-opacity=".5"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="markHalo" cx=".5" cy=".5" r=".5">
      <stop stop-color="#DED3FF" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#7C5CFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".5">
      <stop offset=".45" stop-color="#08030F" stop-opacity="0"/>
      <stop offset="1" stop-color="#08030F" stop-opacity=".56"/>
    </radialGradient>
    <linearGradient id="ringSheen" x1="600" y1="97" x2="600" y2="577" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".03"/>
    </linearGradient>
    <filter id="mesh" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="markGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="16" stdDeviation="26" flood-color="#1A0A3E" flood-opacity=".55"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="canvas">
      <rect width="1200" height="675" rx="34"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1200" height="675" fill="url(#base)"/>

    <g filter="url(#mesh)">
      <ellipse cx="286" cy="132" rx="470" ry="400" fill="url(#blobViolet)"/>
      <ellipse cx="988" cy="586" rx="520" ry="430" fill="url(#blobIndigo)"/>
      <ellipse cx="1012" cy="128" rx="430" ry="360" fill="url(#blobMagenta)"/>
      <ellipse cx="188" cy="596" rx="410" ry="340" fill="url(#blobLilac)"/>
      <ellipse cx="600" cy="338" rx="440" ry="300" fill="url(#blobIndigo)"/>
    </g>

    <circle cx="600" cy="338" r="330" fill="url(#markHalo)"/>
    <circle cx="600" cy="338" r="240" stroke="url(#ringSheen)" stroke-width="1.5"/>
    <circle cx="600" cy="338" r="304" stroke="url(#ringSheen)" stroke-width="1" stroke-opacity=".6"/>

    <svg x="450" y="188" width="300" height="300" viewBox="0 0 128 128" filter="url(#markGlow)">
