    </svg>

    <rect width="1200" height="675" fill="url(#vignette)"/>
    <rect width="1200" height="675" filter="url(#grain)" opacity=".16" style="mix-blend-mode:overlay"/>
    <rect x=".5" y=".5" width="1199" height="674" rx="33.5" stroke="#FFFFFF" stroke-opacity=".1"/>
  </g>
</svg>
