<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="24" x2="1120" y2="651" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171920"/>
      <stop offset=".55" stop-color="#0E1015"/>
      <stop offset="1" stop-color="#090A0D"/>
    </linearGradient>
    <linearGradient id="flow" x1="190" y1="0" x2="1015" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7A3D"/>
      <stop offset=".47" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#66DDB1"/>
    </linearGradient>
    <linearGradient id="headline" x1="257" y1="0" x2="777" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".52" stop-color="#DCD4FF"/>
      <stop offset="1" stop-color="#AEECD7"/>
    </linearGradient>
    <linearGradient id="panelEdge" x1="674" y1="170" x2="1128" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#555B6A"/>
      <stop offset=".45" stop-color="#353946"/>
      <stop offset="1" stop-color="#262A33"/>
    </linearGradient>
    <radialGradient id="hubGlow">
      <stop stop-color="#9C83FF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#9C83FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="40" r="215" fill="#8667FF" fill-opacity=".07"/>
  <circle cx="76" cy="638" r="235" fill="#FF7138" fill-opacity=".05"/>
  <path d="M43 151H1157M43 564H1157" stroke="#FFFFFF" stroke-opacity=".025"/>

  <text x="72" y="82" font-family="-apple-system,BlinkMacSystemFont,Inter,Arial,sans-serif" font-size="40" font-weight="660" letter-spacing="-1.1"><tspan fill="#F7F7F8">Every agent. </tspan><tspan fill="url(#headline)">One conversation history.</tspan></text>
  <text x="72" y="121" fill="#9699A3" font-family="-apple-system,BlinkMacSystemFont,Inter,Arial,sans-serif" font-size="18">Import local chats and continue where you left off in Modesto.</text>

