    <text x="380" y="552" fill="#686D78" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">03</text>
    <text x="416" y="498" fill="#C9CBD2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">decision: preserve provider context</text>
    <text x="416" y="525" fill="#C9CBD2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">handoff: Agent B → Agent C</text>
    <text x="416" y="552" fill="#C9CBD2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">source: thread/8f2 · commit/a13</text>
    <rect x="773" y="486" width="48" height="18" rx="9" fill="#282A3A"/>
    <text x="797" y="499" fill="#C4C8EC" font-size="10" font-weight="650" text-anchor="middle">saved</text>
    <rect x="758" y="513" width="63" height="18" rx="9" fill="#242735"/>
