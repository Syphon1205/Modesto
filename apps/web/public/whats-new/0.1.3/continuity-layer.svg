<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="64" y1="18" x2="1140" y2="665" gradientUnits="userSpaceOnUse">
      <stop stop-color="#181A20"/>
      <stop offset=".52" stop-color="#0E1015"/>
      <stop offset="1" stop-color="#090A0D"/>
    </linearGradient>
    <linearGradient id="rail" x1="118" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#626775"/>
      <stop offset=".34" stop-color="#8F96DB"/>
      <stop offset=".68" stop-color="#737CC7"/>
      <stop offset="1" stop-color="#D6D8E0"/>
    </linearGradient>
    <linearGradient id="title" x1="286" y1="0" x2="824" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#E2E3F5"/>
      <stop offset="1" stop-color="#AEB4E6"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="388" y1="397" x2="822" y2="596" gradientUnits="userSpaceOnUse">
      <stop stop-color="#45495D"/>
      <stop offset=".52" stop-color="#30333E"/>
      <stop offset="1" stop-color="#292C35"/>
    </linearGradient>
    <radialGradient id="centerGlow">
      <stop stop-color="#6F78C7" stop-opacity=".2"/>
      <stop offset="1" stop-color="#6F78C7" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <circle cx="600" cy="338" r="270" fill="url(#centerGlow)" filter="url(#blur)"/>
  <circle cx="1114" cy="74" r="210" fill="#747CC5" fill-opacity=".045"/>
  <circle cx="48" cy="640" r="220" fill="#A7ABB8" fill-opacity=".025"/>
  <path d="M48 150H1152M48 617H1152" stroke="#FFFFFF" stroke-opacity=".03"/>

  <g font-family="-apple-system,BlinkMacSystemFont,Inter,Arial,sans-serif">
    <text x="72" y="76" fill="#9B9EA8" font-size="15" font-weight="650" letter-spacing="2.8">MODESTO 0.1.3 · FREMONT</text>
    <text x="72" y="122" fill="url(#title)" font-size="42" font-weight="680" letter-spacing="-1.3">Context that moves with you.</text>
    <text x="72" y="154" fill="#9296A1" font-size="17">A continuity layer for working across coding agents.</text>
  </g>

  <!-- continuous agent rail -->
  <path d="M130 302C217 302 242 239 329 239C416 239 431 328 520 328C609 328 624 239 711 239C798 239 820 302 907 302H1070"
        stroke="#272B34" stroke-width="16" stroke-linecap="round"/>
  <path d="M130 302C217 302 242 239 329 239C416 239 431 328 520 328C609 328 624 239 711 239C798 239 820 302 907 302H1070"
        stroke="url(#rail)" stroke-width="4" stroke-linecap="round"/>

  <!-- moving context packets -->
  <g>
    <circle cx="205" cy="286" r="12" fill="#8F96DB" fill-opacity=".12" filter="url(#nodeGlow)"/>
    <circle cx="205" cy="286" r="5" fill="#8F96DB"/>
    <circle cx="442" cy="303" r="12" fill="#8F96DB" fill-opacity=".14" filter="url(#nodeGlow)"/>
    <circle cx="442" cy="303" r="5" fill="#A7ACE4"/>
    <circle cx="799" cy="272" r="12" fill="#737CC7" fill-opacity=".14" filter="url(#nodeGlow)"/>
