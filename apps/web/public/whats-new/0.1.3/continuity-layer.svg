    <circle cx="221" cy="625" r="3" fill="#4C505A"/>
    <text x="241" y="630" fill="#AEB1B9" font-size="15">Transparent handoffs</text>
    <circle cx="420" cy="625" r="3" fill="#4C505A"/>
    <text x="440" y="630" fill="#AEB1B9" font-size="15">Repo-native memory</text>
    <circle cx="616" cy="625" r="3" fill="#4C505A"/>
    <text x="636" y="630" fill="#AEB1B9" font-size="15">Clear provenance</text>
    <rect x="974" y="612" width="154" height="32" rx="16" fill="#171920" stroke="#30333B"/>
    <text x="1051" y="633" fill="#D8DAE0" font-size="13" font-weight="650" text-anchor="middle">Continuity layer</text>
