    <text x="417" y="452" fill="#EEEFF2" font-size="15" font-weight="630">.modesto/context.md</text>
    <rect x="725" y="435" width="96" height="25" rx="12.5" fill="#20222A" stroke="#3A3E50"/>
    <circle cx="742" cy="447.5" r="4" fill="#8F96DB"/>
