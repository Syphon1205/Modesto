      <path d="M697 250L711 225L725 250L711 243L697 250Z" stroke="#858DD2" stroke-width="3" stroke-linejoin="round"/>
      <text x="711" y="197" fill="#D0D2D8" font-size="14" font-weight="620">Agent C</text>
    </g>
