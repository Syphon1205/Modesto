name: Modesto
options:
  bundleIdPrefix: com.agentweavr.modesto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Modesto:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Modesto
    settings:
      base:
        PRODUCT_NAME: Modesto
        PRODUCT_BUNDLE_IDENTIFIER: com.agentweavr.modesto.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Modesto
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Modesto connects to coding agents and terminals running on your trusted computers.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO

schemes:
  Modesto:
    build:
      targets:
        Modesto: all
    run:
      config: Debug
    archive:
      config: Release
